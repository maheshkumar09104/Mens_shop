services:
  - type: web
    name: mens-shop-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://your-vercel-frontend.vercel.app
      - key: CLIENT_URLS
        value: https://your-vercel-frontend.vercel.app,http://localhost:5173
